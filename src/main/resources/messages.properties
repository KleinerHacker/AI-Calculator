window.title=AI Calculator

# Language neutral placeholders, no translation needed.
formula.placeholder=12+34*2
formula.result.placeholder=0

keypad.key.digit0=0 - Zero (Keyboard: 0)
keypad.key.digit1=1 - One (Keyboard: 1)
keypad.key.digit2=2 - Two (Keyboard: 2)
keypad.key.digit3=3 - Three (Keyboard: 3)
keypad.key.digit4=4 - Four (Keyboard: 4)
keypad.key.digit5=5 - Five (Keyboard: 5)
keypad.key.digit6=6 - Six (Keyboard: 6)
keypad.key.digit7=7 - Seven (Keyboard: 7)
keypad.key.digit8=8 - Eight (Keyboard: 8)
keypad.key.digit9=9 - Nine (Keyboard: 9)
keypad.key.add=+ - Add (Keyboard: +)
keypad.key.subtract=- - Subtract (Keyboard: -)
keypad.key.multiply=* - Multiply (Keyboard: *)
keypad.key.divide=/ - Divide (Keyboard: /)
keypad.key.equals== - Calculate result (Keyboard: Enter or =)
keypad.key.clear=C - Clear formula (Keyboard: Esc or Del)
