window.title=KI-Rechner

keypad.key.digit0=0 - Null (Tastatur: 0)
keypad.key.digit1=1 - Eins (Tastatur: 1)
keypad.key.digit2=2 - Zwei (Tastatur: 2)
keypad.key.digit3=3 - Drei (Tastatur: 3)
keypad.key.digit4=4 - Vier (Tastatur: 4)
keypad.key.digit5=5 - Fünf (Tastatur: 5)
keypad.key.digit6=6 - Sechs (Tastatur: 6)
keypad.key.digit7=7 - Sieben (Tastatur: 7)
keypad.key.digit8=8 - Acht (Tastatur: 8)
keypad.key.digit9=9 - Neun (Tastatur: 9)
keypad.key.add=+ - Addieren (Tastatur: +)
keypad.key.subtract=- - Subtrahieren (Tastatur: -)
keypad.key.multiply=* - Multiplizieren (Tastatur: *)
keypad.key.divide=/ - Dividieren (Tastatur: /)
keypad.key.equals== - Ergebnis berechnen (Tastatur: Enter oder =)
keypad.key.clear=C - Formel löschen (Tastatur: Esc oder Entf)
